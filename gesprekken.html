        <form class="composer composer--big" data-comp="chat" data-action-submit="send">
    <div class="comp-ctx">
      <span class="comp-ctx-label">Context</span>
      <span class="chip chip--scope" title="Rise kijkt in al je projecten">Alle projecten</span>
    </div>

    <div class="comp-bar">
      <button type="button" class="comp-btn" id="composer-context-chat" aria-expanded="false" aria-controls="choice-popover" data-action="pop-context" data-comp="chat"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Context</span></button>

    </div>
  </form>
